name: Deploy app

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOST }}
      SSH_USER: ${{ secrets.USER }}
      APP_PATH: ${{ secrets.APP_PATH }}
    steps:
      - name: Set deployment target
        run: |
          case "${APP_PATH}" in
            /*) ;;
            *) echo "APP_PATH must be an absolute path" >&2; exit 1;;
          esac
          case "${APP_PATH}" in
            *[[:space:]]*) echo "APP_PATH must not contain whitespace" >&2; exit 1;;
          esac
          printf 'DEPLOY_TARGET=%s\n' "${APP_PATH}" >> "${GITHUB_ENV}"
          printf 'DEPLOY_LABEL=production\n' >> "${GITHUB_ENV}"
          printf 'DEPLOY_REF=refs/tags/${{ github.event.release.tag_name }}\n' >> "${GITHUB_ENV}"

      - name: Validate deployment inputs
        run: |
          for required in SSH_HOST SSH_USER APP_PATH DEPLOY_TARGET DEPLOY_REF; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required value: ${required}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS is not configured" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Deploy Git revision
        run: |
          deploy_command=$(printf 'ood-proteindesign-deploy %q %q' "${DEPLOY_TARGET}" "${DEPLOY_REF}")
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" "${deploy_command}"

      - name: Report deployment target
        run: |
          echo "Deployed ${DEPLOY_LABEL} (${DEPLOY_REF}) to ${DEPLOY_TARGET}"
